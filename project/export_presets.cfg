; Export presets for the three desktop targets, all buildable from Linux.
;
; Build them with tools/build_releases.sh, or one at a time:
;   godot --headless --path project --export-release "Linux/Fedora" ../build/...
;
; NOTE ON ASSETS: every export embeds project/assets/, which is the
; ORIGINAL Bitmap Brothers art and sound. The binaries these presets
; produce are for LOCAL USE ONLY and must not be redistributed. See
; docs/RESEARCH.md licensing.
;
; NOTE ON THE WINDOWS .EXE ICON: Godot embeds application/icon_ico into
; the .exe with rcedit, which needs wine. Wine is deliberately not
; installed here, so application/icon is left empty and the .exe keeps
; Godot's default file icon in Explorer. The GAME WINDOW icon comes from
; config/icon in project.godot and is correct on every platform.

[preset.0]

name="Linux/Fedora"
platform="Linux"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="../build/linux/z-remake.x86_64"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
ssh_remote_deploy/enabled=false

